name: Update Dependency

on:
  repository_dispatch:
    types: [dependency_update]
  workflow_dispatch:

jobs:
  update-dep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update package dependency
        run: |
          npm install kschema-fs-api-gen-del-actions@latest
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff-index --quiet HEAD || (git commit -m "chore: update dependency kschema-fs-api-gen-del-actions to latest" && git push origin main)
